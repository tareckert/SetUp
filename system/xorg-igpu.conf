# /etc/X11/xorg.conf.d/10-ki-igpu.conf – KI-Workstation
# Bildschirm über die Intel-iGPU (Monitor am Mainboard). Die RTX bleibt komplett für CUDA frei:
# kein Xorg im VRAM, keine Ruckler der Oberfläche während des Trainings.
# Rückgängig: Datei löschen und Monitor wieder an die Grafikkarte.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "iGPU"
    Driver     "modesetting"
    BusID      "@BUSID@"
EndSection
