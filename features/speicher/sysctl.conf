# /etc/sysctl.d/90-ki-speicher.conf – KI-Workstation (Funktion speicher)
# zram ist schneller Swap: hohe swappiness lagert ruhende Seiten früh komprimiert aus und
# lässt mehr echten RAM für Training und Datensätze. page-cluster=0: zram braucht kein Readahead.
vm.swappiness = 100
vm.page-cluster = 0
