# oberflaeche/i3.conf – i3 der KI-Workstation (eigene Ergänzungen: ~/.ki/oberflaeche/eigene.conf)
#
# Mod-Taste ist die Win-Taste: Alt gehört PyCharm (Alt+Enter Quick-Fix, Alt+1 Projektfenster …)
set $mod Mod4
font pango:JetBrains Mono, DejaVu Sans Mono 10

# Arbeitsflächen mit Namen – die Leiste zeigt "Menü IDE Extra"
set $ws1 "1:Menü"
set $ws2 "2:IDE"
set $ws3 "3:Extra"
set $ws4 "4:Frei"
assign [instance="^ki-menu$"]  $ws1
assign [class="^jetbrains-"]   $ws2
assign [instance="^ki-extra$"] $ws3
workspace_auto_back_and_forth yes
focus_on_window_activation smart
focus_follows_mouse no

default_border pixel 1
default_floating_border pixel 1
hide_edge_borders smart
for_window [instance="^ki-menu$"] border pixel 0

# Darcula
client.focused          #CC7832 #CC7832 #2B2B2B #CC7832 #CC7832
client.focused_inactive #3C3F41 #3C3F41 #A9B7C6 #3C3F41 #3C3F41
client.unfocused        #2B2B2B #2B2B2B #808080 #2B2B2B #2B2B2B
client.urgent           #F2777A #F2777A #2B2B2B #F2777A #F2777A
client.background       #2B2B2B

# Programme
bindsym $mod+Return       exec urxvt
bindsym $mod+d            exec ki dateien
bindsym $mod+g            exec urxvt -name ki-extra -title GPU-Monitor -e ki top

# Fenster
bindsym $mod+Shift+q      kill
bindsym $mod+f            fullscreen toggle
bindsym $mod+Shift+space  floating toggle
bindsym $mod+Left         focus left
bindsym $mod+Right        focus right
bindsym $mod+Up           focus up
bindsym $mod+Down         focus down
bindsym $mod+Shift+Left   move left
bindsym $mod+Shift+Right  move right
bindsym $mod+Shift+Up     move up
bindsym $mod+Shift+Down   move down
# Zwei Projekte nebeneinander: Win+E nebeneinander/untereinander, Win+W als Reiter
bindsym $mod+e            layout toggle split
bindsym $mod+w            layout tabbed
bindsym $mod+r            mode "Größe"
mode "Größe" {
    bindsym Left  resize shrink width 5 px or 5 ppt
    bindsym Right resize grow width 5 px or 5 ppt
    bindsym Up    resize shrink height 5 px or 5 ppt
    bindsym Down  resize grow height 5 px or 5 ppt
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# Arbeitsflächen
bindsym $mod+1            workspace $ws1
bindsym $mod+2            workspace $ws2
bindsym $mod+3            workspace $ws3
bindsym $mod+4            workspace $ws4
bindsym $mod+Shift+1      move container to workspace $ws1
bindsym $mod+Shift+2      move container to workspace $ws2
bindsym $mod+Shift+3      move container to workspace $ws3
bindsym $mod+Shift+4      move container to workspace $ws4
bindsym $mod+Tab          workspace back_and_forth
# Zweiter Monitor: Win+O schiebt die Arbeitsfläche, Win+Shift+O das Fenster hinüber
bindsym $mod+o            move workspace to output next
bindsym $mod+Shift+o      move container to output next
bindsym $mod+Shift+r      restart
# Bewusst keine Taste für "i3 beenden": ein Fehlgriff würde PyCharm mitreißen.

bar {
    status_command exec ki statusbar
    position bottom
    tray_output none
    strip_workspace_numbers yes
    colors {
        background #2B2B2B
        statusline #A9B7C6
        separator  #555555
        focused_workspace  #CC7832 #CC7832 #2B2B2B
        active_workspace   #3C3F41 #3C3F41 #A9B7C6
        inactive_workspace #2B2B2B #2B2B2B #808080
        urgent_workspace   #F2777A #F2777A #2B2B2B
    }
}

exec --no-startup-id xsetroot -solid "#2B2B2B"
# Menü: kommt nach dem Schließen nach 1 s wieder. Bricht es ab (oder ist die Funktion "menue"
# nicht installiert), bleibt eine Shell im Fenster – nie ein leerer Bildschirm.
exec --no-startup-id sh -c 'while :; do urxvt -name ki-menu -e sh -c "ki menu || { echo; echo \"Kein Menü – Shell (exit = neu versuchen)\"; exec bash; }"; sleep 1; done'

include ~/.ki/oberflaeche/eigene*.conf
