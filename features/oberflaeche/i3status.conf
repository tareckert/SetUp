# oberflaeche/i3status.conf – Basis der Statusleiste (ki statusbar ergänzt Jobs und GPU)
general {
    output_format = "none"
    colors = false
    interval = 10
}

order += "cpu_usage"
order += "memory"
order += "disk /"
order += "tztime local"

cpu_usage {
    format = "CPU %usage"
}
memory {
    memory_used_method = memavailable
    format = "RAM %used/%total"
    threshold_degraded = "1G"
    format_degraded = "RAM knapp: %available frei"
}
disk "/" {
    format = "SSD %avail frei"
}
tztime local {
    format = "%a %d.%m. %H:%M"
}
