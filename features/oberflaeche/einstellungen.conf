# ~/.ki/oberflaeche/einstellungen.conf – wird beim Start der Oberfläche angewendet
# Bequemer ändern: Menü → Einstellungen. Werte in Anführungszeichen, Shell-Syntax.
DPI="96"                 # Skalierung: 96 = 100 %, 120 = 125 %, 144 = 150 %
SCHRIFT="11"             # Schriftgröße im Terminal
SCHONER="10"             # Bildschirm aus nach … Minuten (0 = nie)
TASTATUR=""              # Tastaturlayout, z. B. de, us, ch (leer = Systemeinstellung)
WIEDERHOLUNG="250 40"    # Tastenwiederholung: Verzögerung in ms, Zeichen pro Sekunde
BILDSCHIRM=""            # xrandr-Argumente für Auflösung/zweiten Monitor (leer = automatisch)
AUTOSTART="ja"           # Oberfläche nach dem Login auf tty1 starten
